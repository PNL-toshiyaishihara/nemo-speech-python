# Reusable: the Windows Vulkan wheel (local version label +vulkan) from the
# sdist artifact of the calling run.
name: vulkan

on:
  workflow_call:

permissions:
  contents: read

jobs:
  wheel:
    runs-on: windows-2022
    env:
      VULKAN_SDK_VERSION: "1.4.341.1"
      # Published by LunarG at
      # https://vulkan.lunarg.com/sdk/sha/<version>/windows/<file>.txt
      VULKAN_SDK_SHA256: bcf2d75aa9556889ab974858666e20b3655b6055a0db704ccb47279ff33b5bfe
      CIBW_CONFIG_SETTINGS_WINDOWS: build-dir=C:/b
      # Every PyPI install is pinned (see the file).
      PIP_CONSTRAINT: ${{ github.workspace }}/.github/build-constraints.txt
      PIP_BUILD_CONSTRAINT: ${{ github.workspace }}/.github/build-constraints.txt
      CIBW_DEPENDENCY_VERSIONS: ${{ github.workspace }}/.github/build-constraints.txt
    steps:
      # Only the build constraints; the build itself uses the sdist.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/build-constraints.txt
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sdist
          path: sdist
      - name: Install the Vulkan SDK (glslc and the loader)
        shell: pwsh
        run: |
          $installer = "$env:RUNNER_TEMP\vulkan-sdk.exe"
          Invoke-WebRequest "https://sdk.lunarg.com/sdk/download/$env:VULKAN_SDK_VERSION/windows/vulkansdk-windows-X64-$env:VULKAN_SDK_VERSION.exe" -OutFile $installer
          $actual = (Get-FileHash $installer -Algorithm SHA256).Hash
          if ($actual -ne $env:VULKAN_SDK_SHA256) { throw "Vulkan SDK SHA-256 is $actual, expected $env:VULKAN_SDK_SHA256" }
          & $installer --root "C:\VulkanSDK\$env:VULKAN_SDK_VERSION" --accept-licenses --default-answer --confirm-command install
          "VULKAN_SDK=C:\VulkanSDK\$env:VULKAN_SDK_VERSION" | Out-File -Append $env:GITHUB_ENV
          "C:\VulkanSDK\$env:VULKAN_SDK_VERSION\Bin" | Out-File -Append $env:GITHUB_PATH
      - name: Locate sdist
        shell: bash
        run: echo "SDIST=$(ls sdist/*.tar.gz)" >> "$GITHUB_ENV"
      - uses: pypa/cibuildwheel@adba99c781d3746d38b3a09b1cf797965bcb7fe6 # v4.3.0
        with:
          package-dir: ${{ env.SDIST }}
          output-dir: wheelhouse
        env:
          # Enables GGML_VULKAN and the +vulkan label (pyproject.toml overrides).
          CIBW_ENVIRONMENT_WINDOWS: NEMO_SPEECH_VARIANT=vulkan
          # vulkan-1.dll comes from the GPU driver; never bundle the loader.
          CIBW_REPAIR_WHEEL_COMMAND_WINDOWS: >-
            delvewheel repair --analyze-existing --ignore-existing --exclude vulkan-1.dll -w {dest_dir} {wheel}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-vulkan-windows-2022
          path: wheelhouse/*.whl
