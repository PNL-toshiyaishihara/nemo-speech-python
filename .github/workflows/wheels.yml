name: wheels

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # cibuildwheel unpacks the sdist under %TEMP%; with the nested ExternalProject
  # trees (wrapper -> NeMo-Speech.cpp -> ggml's vulkan-shaders-gen) MSBuild paths
  # then exceed MAX_PATH. A short build directory keeps them well below it.
  CIBW_CONFIG_SETTINGS_WINDOWS: build-dir=C:/b

jobs:
  sdist:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Check out the submodules the build needs
        run: |
          git submodule update --init vendor/NeMo-Speech.cpp vendor/sentencepiece
          git -C vendor/NeMo-Speech.cpp submodule update --init --depth 1 llama.cpp
      - name: Build sdist
        run: pipx run build --sdist
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz

  # CPU wheels, built from the sdist so a file missing from it fails here.
  wheels:
    needs: sdist
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, windows-2022, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: sdist
          path: sdist
      - name: Locate sdist
        shell: bash
        run: echo "SDIST=$(ls sdist/*.tar.gz)" >> "$GITHUB_ENV"
      - uses: pypa/cibuildwheel@v4.2.1
        with:
          package-dir: ${{ env.SDIST }}
          output-dir: wheelhouse
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-cpu-${{ matrix.os }}
          path: wheelhouse/*.whl

  # Vulkan variant for Windows. Same distribution name as the CPU wheel, so it
  # belongs on a separate index (as llama-cpp-python does for GPU builds).
  wheels-vulkan-windows:
    needs: sdist
    runs-on: windows-2022
    env:
      VULKAN_SDK_VERSION: "1.4.341.1"
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: sdist
          path: sdist
      - name: Install the Vulkan SDK (glslc and the loader)
        shell: pwsh
        run: |
          $installer = "$env:RUNNER_TEMP\vulkan-sdk.exe"
          Invoke-WebRequest "https://sdk.lunarg.com/sdk/download/$env:VULKAN_SDK_VERSION/windows/vulkansdk-windows-X64-$env:VULKAN_SDK_VERSION.exe" -OutFile $installer
          & $installer --root "C:\VulkanSDK\$env:VULKAN_SDK_VERSION" --accept-licenses --default-answer --confirm-command install
          "VULKAN_SDK=C:\VulkanSDK\$env:VULKAN_SDK_VERSION" | Out-File -Append $env:GITHUB_ENV
          "C:\VulkanSDK\$env:VULKAN_SDK_VERSION\Bin" | Out-File -Append $env:GITHUB_PATH
      - name: Locate sdist
        shell: bash
        run: echo "SDIST=$(ls sdist/*.tar.gz)" >> "$GITHUB_ENV"
      - uses: pypa/cibuildwheel@v4.2.1
        with:
          package-dir: ${{ env.SDIST }}
          output-dir: wheelhouse
        env:
          CIBW_ENVIRONMENT_WINDOWS: CMAKE_ARGS="-DGGML_VULKAN=ON"
          # vulkan-1.dll comes from the GPU driver; never bundle the loader.
          CIBW_REPAIR_WHEEL_COMMAND_WINDOWS: >-
            delvewheel repair --analyze-existing --ignore-existing --exclude vulkan-1.dll -w {dest_dir} {wheel}
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-vulkan-windows
          path: wheelhouse/*.whl

  # CUDA variant (Linux x86_64 and Windows x64). Several hours of nvcc per
  # platform, so it runs on tags and on manual dispatch only. Like Vulkan it
  # shares the distribution name and belongs on a separate index. The repair
  # step bundles the CUDA runtime, cuBLAS and cuBLASLt so the wheel needs only
  # the NVIDIA driver (libcuda.so.1 / nvcuda.dll), which is never bundled.
  wheels-cuda:
    needs: sdist
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360
    env:
      # Turing..Hopper as SASS, plus Blackwell SASS and PTX for newer GPUs.
      CUDA_ARCHS: "75-real;80-real;86-real;89-real;90-real;120"
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: sdist
          path: sdist
      - name: Install the CUDA 12.8 toolkit (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = "$env:RUNNER_TEMP\cuda-network.exe"
          Invoke-WebRequest "https://developer.download.nvidia.com/compute/cuda/12.8.1/network_installers/cuda_12.8.1_windows_network.exe" -OutFile $installer
          $p = Start-Process $installer -Wait -PassThru -ArgumentList "-s nvcc_12.8 cudart_12.8 cublas_12.8 cublas_dev_12.8 thrust_12.8 visual_studio_integration_12.8"
          if ($p.ExitCode -ne 0) { throw "CUDA installer exited with $($p.ExitCode)" }
          $cuda = "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v12.8"
          # The installer does not always register with the runner's VS edition.
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          Copy-Item "$cuda\extras\visual_studio_integration\MSBuildExtensions\*" "$vs\MSBuild\Microsoft\VC\v170\BuildCustomizations" -Force
          "CUDA_PATH=$cuda" | Out-File -Append $env:GITHUB_ENV
          "$cuda\bin" | Out-File -Append $env:GITHUB_PATH
      - name: Locate sdist
        shell: bash
        run: echo "SDIST=$(ls sdist/*.tar.gz)" >> "$GITHUB_ENV"
      - uses: pypa/cibuildwheel@v4.2.1
        with:
          package-dir: ${{ env.SDIST }}
          output-dir: wheelhouse
        env:
          CIBW_ARCHS_LINUX: x86_64
          CIBW_BEFORE_ALL_LINUX: >-
            git config --global --add safe.directory '*' &&
            dnf install -y dnf-plugins-core &&
            dnf config-manager --add-repo https://developer.download.nvidia.com/compute/cuda/repos/rhel8/x86_64/cuda-rhel8.repo &&
            dnf install -y cuda-nvcc-12-8 cuda-cudart-devel-12-8 cuda-cccl-12-8 cuda-driver-devel-12-8 libcublas-devel-12-8 cuda-documentation-12-8
          CIBW_ENVIRONMENT_LINUX: >-
            CUDACXX=/usr/local/cuda-12.8/bin/nvcc
            PATH=/usr/local/cuda-12.8/bin:$PATH
            CMAKE_ARGS="-DGGML_CUDA=ON -DCMAKE_CUDA_ARCHITECTURES=${{ env.CUDA_ARCHS }}"
          CIBW_ENVIRONMENT_WINDOWS: >-
            CMAKE_ARGS="-DGGML_CUDA=ON -DCMAKE_CUDA_ARCHITECTURES=${{ env.CUDA_ARCHS }}"
          CIBW_REPAIR_WHEEL_COMMAND_LINUX: auditwheel repair --exclude libcuda.so.1 -w {dest_dir} {wheel}
          CIBW_REPAIR_WHEEL_COMMAND_WINDOWS: >-
            delvewheel repair --analyze-existing --ignore-existing --exclude nvcuda.dll -w {dest_dir} {wheel}
          # No GPU driver on the runners. Linux loads the toolkit's stub
          # libcuda (no devices, so everything runs on the CPU); Windows has no
          # stub, so its wheel is only built and repaired.
          CIBW_TEST_COMMAND_LINUX: >-
            mkdir -p /tmp/cudastub &&
            ln -sf /usr/local/cuda-12.8/lib64/stubs/libcuda.so /tmp/cudastub/libcuda.so.1 &&
            LD_LIBRARY_PATH=/tmp/cudastub pytest {project}/tests -p no:cacheprovider
          CIBW_TEST_SKIP: "*-win_amd64"
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-cuda-${{ matrix.os }}
          path: wheelhouse/*.whl
