# Reusable: CUDA wheels (Linux x86_64 and Windows x64) for one CUDA release,
# from the sdist artifact of the calling run.
#
# The local version label follows the toolkit (+cu128 for 12.8, +cu130 for
# 13.0). The repair step bundles the CUDA runtime, cuBLAS and cuBLASLt so a
# wheel needs only the NVIDIA driver (libcuda.so.1 / nvcuda.dll), which is
# never bundled. With cublas_shim, upstream's shim takes cuBLAS's library name
# inside the wheel, so the repair step bundles neither cuBLAS nor cuBLASLt.
name: cuda

on:
  workflow_call:
    inputs:
      cuda:
        description: CUDA toolkit version, major.minor.patch (Windows installer)
        type: string
        required: true
      # The release list, used by release.yml and manual wheels.yml runs:
      # native code for Turing (7.5) to Blackwell (10.0, 12.0) plus compute_90
      # PTX, which the driver compiles for any other newer GPU. The patched
      # ggml-cuda turns 100 and 12X into 100a and 12Xa, which run on exactly
      # that compute capability, so the PTX must come from a plain
      # architecture (as ggml's own default list does).
      archs:
        description: CMAKE_CUDA_ARCHITECTURES
        type: string
        default: "75-real;80-real;86-real;89-real;90-real;100-real;120-real;90-virtual"
      platforms:
        description: JSON list of runners
        type: string
        default: '["ubuntu-24.04", "windows-2022"]'
      upload:
        description: Upload the wheels as artifacts (about 700 MB each)
        type: boolean
        default: true
      # Release wheels bundle the real cuBLAS. The shim is much smaller, but
      # its speed against cuBLAS has not been measured on a GPU yet.
      cublas_shim:
        description: Use upstream's cuBLAS shim instead of bundling cuBLAS
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  wheel:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.platforms) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360
    env:
      # The caller's workflow-level env does not reach a reusable workflow.
      # cibuildwheel unpacks the sdist under %TEMP%; nested ExternalProject
      # trees would push MSBuild paths past MAX_PATH there.
      CIBW_CONFIG_SETTINGS_WINDOWS: build-dir=C:/b
    steps:
      - name: Derive the CUDA names
        id: cuda
        shell: bash
        run: |
          full="${{ inputs.cuda }}"
          mm="${full%.*}"                 # 12.8
          major="${mm%.*}"                # 12
          minor="${mm#*.}"                # 8
          # CUDA 13 split the C runtime headers and NVVM out of the nvcc component.
          components="nvcc_$mm cudart_$mm cublas_$mm cublas_dev_$mm thrust_$mm visual_studio_integration_$mm"
          if [ "$major" -ge 13 ]; then components="$components crt_$mm nvvm_$mm"; fi
          # ggml-cuda still links the toolkit's cuBLAS with the shim, so the
          # components stay the same. The wheel keeps its +cuXY name; the
          # artifact name and build_info() tell a shim build apart.
          if [ "${{ inputs.cublas_shim }}" = true ]; then shim=ON; suffix=-shim; else shim=OFF; suffix=; fi
          {
            echo "mm=$mm"
            echo "dash=${major}-${minor}"
            echo "underscore=${major}_${minor}"
            echo "variant=cu${major}${minor}"
            echo "components=$components"
            echo "shim=$shim"
            echo "suffix=$suffix"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sdist
          path: sdist
      - name: Install the CUDA toolkit (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CUDA_FULL: ${{ inputs.cuda }}
          CUDA_MM: ${{ steps.cuda.outputs.mm }}
          CUDA_UNDERSCORE: ${{ steps.cuda.outputs.underscore }}
          CUDA_COMPONENTS: ${{ steps.cuda.outputs.components }}
        run: |
          $installer = "$env:RUNNER_TEMP\cuda-network.exe"
          Invoke-WebRequest "https://developer.download.nvidia.com/compute/cuda/$env:CUDA_FULL/network_installers/cuda_$($env:CUDA_FULL)_windows_network.exe" -OutFile $installer
          $p = Start-Process $installer -Wait -PassThru -ArgumentList "-s $env:CUDA_COMPONENTS"
          if ($p.ExitCode -ne 0) { throw "CUDA installer exited with $($p.ExitCode)" }
          $cuda = "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v$env:CUDA_MM"
          # The installer does not always register with the runner's VS edition.
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          Copy-Item "$cuda\extras\visual_studio_integration\MSBuildExtensions\*" "$vs\MSBuild\Microsoft\VC\v170\BuildCustomizations" -Force
          # The MSBuild CUDA integration locates the toolkit through this.
          "CUDA_PATH_V$env:CUDA_UNDERSCORE=$cuda" | Out-File -Append $env:GITHUB_ENV
          "CUDA_PATH=$cuda" | Out-File -Append $env:GITHUB_ENV
          # CUDA 13 keeps the runtime DLLs in bin\x64; delvewheel finds them on PATH.
          foreach ($dir in "$cuda\bin", "$cuda\bin\x64") {
            if (Test-Path $dir) { $dir | Out-File -Append $env:GITHUB_PATH }
          }
      - name: Locate sdist
        shell: bash
        run: echo "SDIST=$(ls sdist/*.tar.gz)" >> "$GITHUB_ENV"
      - uses: pypa/cibuildwheel@e090b81e30c4d855ea63bf4b6e59204c09a101ae # v4.2.1
        with:
          package-dir: ${{ env.SDIST }}
          output-dir: wheelhouse
        env:
          CIBW_ARCHS_LINUX: x86_64
          CIBW_BEFORE_ALL_LINUX: >-
            git config --global --add safe.directory '*' &&
            dnf install -y dnf-plugins-core &&
            dnf config-manager --add-repo https://developer.download.nvidia.com/compute/cuda/repos/rhel8/x86_64/cuda-rhel8.repo &&
            dnf install -y
            cuda-nvcc-${{ steps.cuda.outputs.dash }}
            cuda-cudart-devel-${{ steps.cuda.outputs.dash }}
            cuda-cccl-${{ steps.cuda.outputs.dash }}
            cuda-driver-devel-${{ steps.cuda.outputs.dash }}
            libcublas-devel-${{ steps.cuda.outputs.dash }}
            cuda-documentation-${{ steps.cuda.outputs.dash }}
          # NEMO_SPEECH_VARIANT enables GGML_CUDA and the +cuXY label
          # (pyproject.toml overrides); the build checks it against the toolkit.
          CIBW_ENVIRONMENT_LINUX: >-
            NEMO_SPEECH_VARIANT=${{ steps.cuda.outputs.variant }}
            CUDACXX=/usr/local/cuda-${{ steps.cuda.outputs.mm }}/bin/nvcc
            PATH=/usr/local/cuda-${{ steps.cuda.outputs.mm }}/bin:$PATH
            CMAKE_ARGS="-DCMAKE_CUDA_ARCHITECTURES=${{ inputs.archs }} -DNEMO_SPEECH_CUBLAS_SHIM=${{ steps.cuda.outputs.shim }}"
          CIBW_ENVIRONMENT_WINDOWS: >-
            NEMO_SPEECH_VARIANT=${{ steps.cuda.outputs.variant }}
            CMAKE_ARGS="-DCMAKE_CUDA_ARCHITECTURES=${{ inputs.archs }} -DNEMO_SPEECH_CUBLAS_SHIM=${{ steps.cuda.outputs.shim }}"
          CIBW_REPAIR_WHEEL_COMMAND_LINUX: auditwheel repair --exclude libcuda.so.1 -w {dest_dir} {wheel}
          CIBW_REPAIR_WHEEL_COMMAND_WINDOWS: >-
            delvewheel repair --analyze-existing --ignore-existing --exclude nvcuda.dll -w {dest_dir} {wheel}
          # No GPU driver on the runners. Linux loads the toolkit's stub
          # libcuda (no devices, so everything runs on the CPU); Windows has no
          # stub, so its wheel is only built and repaired.
          CIBW_TEST_COMMAND_LINUX: >-
            mkdir -p /tmp/cudastub &&
            ln -sf /usr/local/cuda-${{ steps.cuda.outputs.mm }}/lib64/stubs/libcuda.so /tmp/cudastub/libcuda.so.1 &&
            LD_LIBRARY_PATH=/tmp/cudastub pytest {project}/tests -p no:cacheprovider
          CIBW_TEST_SKIP: "*-win_amd64"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: inputs.upload
        with:
          name: wheels-${{ steps.cuda.outputs.variant }}${{ steps.cuda.outputs.suffix }}-${{ matrix.os }}
          path: wheelhouse/*.whl
