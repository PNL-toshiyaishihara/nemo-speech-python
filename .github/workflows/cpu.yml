# Reusable: CPU wheels (Linux x86_64/aarch64, Windows x64, macOS arm64 with
# Metal) from the sdist artifact of the calling run. Each wheel is built once
# and tested on every Python in pyproject.toml's cibuildwheel `build` list.
name: cpu

on:
  workflow_call:

permissions:
  contents: read

jobs:
  wheel:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, windows-2022, macos-14]
    runs-on: ${{ matrix.os }}
    env:
      # cibuildwheel unpacks the sdist under %TEMP%; nested ExternalProject
      # trees would push MSBuild paths past MAX_PATH there.
      CIBW_CONFIG_SETTINGS_WINDOWS: build-dir=C:/b
      # Every PyPI install is pinned (see the file); cibuildwheel copies it
      # into the Linux containers as /constraints.txt.
      PIP_CONSTRAINT: ${{ github.workspace }}/.github/build-constraints.txt
      PIP_BUILD_CONSTRAINT: ${{ github.workspace }}/.github/build-constraints.txt
      CIBW_DEPENDENCY_VERSIONS: ${{ github.workspace }}/.github/build-constraints.txt
      CIBW_ENVIRONMENT_LINUX: PIP_CONSTRAINT=/constraints.txt PIP_BUILD_CONSTRAINT=/constraints.txt
    steps:
      # Only the build constraints; the build itself uses the sdist.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/build-constraints.txt
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sdist
          path: sdist
      - name: Locate sdist
        shell: bash
        run: echo "SDIST=$(ls sdist/*.tar.gz)" >> "$GITHUB_ENV"
      - uses: pypa/cibuildwheel@adba99c781d3746d38b3a09b1cf797965bcb7fe6 # v4.3.0
        with:
          package-dir: ${{ env.SDIST }}
          output-dir: wheelhouse
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-cpu-${{ matrix.os }}
          path: wheelhouse/*.whl
