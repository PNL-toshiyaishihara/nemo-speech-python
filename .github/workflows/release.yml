# Tag push v* -> every wheel variant built and tested -> a *draft* GitHub
# Release with the wheels, the sdist, SHA256SUMS and generated notes. Review
# the draft and publish it by hand. See RELEASING.md.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    outputs:
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # to check that the tag is on main
          persist-credentials: false
      - name: Check that the tag points at main
        shell: bash
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::${GITHUB_REF_NAME} (${GITHUB_SHA}) is not a commit on main; tag a merge commit of main"
            exit 1
          fi
      - name: Check the tag against the package version
        id: version
        shell: bash
        run: |
          version=$(python3 -c "import re; print(re.search(r'^__version__ = \"([^\"]+)\"', open('nemo_speech/__init__.py', encoding='utf-8').read(), re.M).group(1))")
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match __version__ ${version} (expected v${version})"
            exit 1
          fi
          if [[ "$version" =~ (a|b|rc|dev)[0-9]*$ ]]; then prerelease=true; else prerelease=false; fi
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "Releasing $version (prerelease: $prerelease)"

  sdist:
    needs: verify
    uses: ./.github/workflows/sdist.yml

  cpu:
    needs: sdist
    uses: ./.github/workflows/cpu.yml

  vulkan:
    needs: sdist
    uses: ./.github/workflows/vulkan.yml

  # Keep the toolkit list in sync with wheels.yml. The architectures are
  # cuda.yml's default.
  cuda:
    needs: sdist
    strategy:
      fail-fast: false
      matrix:
        cuda: ["12.8.1", "13.0.2"]
    uses: ./.github/workflows/cuda.yml
    with:
      cuda: ${{ matrix.cuda }}

  publish:
    needs: [verify, sdist, cpu, vulkan, cuda]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # previous tags and their submodule pins, for the notes
          # The publish steps reach the API through GH_TOKEN, not git.
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Check the assets
        working-directory: dist
        shell: bash
        run: |
          # One wheel per variant and platform (see RELEASING.md) and the sdist.
          expected=(
            '-py3-none-manylinux_*_x86_64.whl'
            '-py3-none-manylinux_*_aarch64.whl'
            '-py3-none-win_amd64.whl'
            '-py3-none-macosx_*_arm64.whl'
            '+vulkan-py3-none-win_amd64.whl'
            '+cu128-py3-none-manylinux_*_x86_64.whl'
            '+cu128-py3-none-win_amd64.whl'
            '+cu130-py3-none-manylinux_*_x86_64.whl'
            '+cu130-py3-none-win_amd64.whl'
          )
          version="${GITHUB_REF_NAME#v}"
          status=0
          for suffix in "${expected[@]}"; do
            mapfile -t found < <(compgen -G "nemo_speech-${version}${suffix}" || true)
            if [ "${#found[@]}" -ne 1 ]; then
              echo "::error::expected one nemo_speech-${version}${suffix}, found ${#found[@]}"
              status=1
            fi
          done
          if [ ! -f "nemo_speech-${version}.tar.gz" ]; then
            echo "::error::missing the sdist nemo_speech-${version}.tar.gz"
            status=1
          fi
          count=$(ls | wc -l)
          if [ "$count" -ne $(( ${#expected[@]} + 1 )) ]; then
            echo "::error::expected $(( ${#expected[@]} + 1 )) files, found ${count}:"
            ls
            status=1
          fi
          exit $status
      - name: Checksums
        working-directory: dist
        run: |
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
      - name: Release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release_notes.py --tag "${GITHUB_REF_NAME}" --dist dist > notes.md
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          # A published release is never replaced. Drafts left by an earlier
          # run for this tag (re-tagged after a failure, or re-run) are
          # deleted, so only one draft can be published.
          releases=$(gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate \
            --jq ".[] | select(.tag_name == \"${GITHUB_REF_NAME}\") | \"\(.id) \(.draft)\"")
          while read -r id draft; do
            [ -n "$id" ] || continue
            if [ "$draft" != "true" ]; then
              echo "::error::${GITHUB_REF_NAME} is already published; release a new version instead"
              exit 1
            fi
            echo "Deleting the earlier draft ${id}"
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/${id}"
          done <<< "$releases"
          args=(--draft --verify-tag --title "nemo-speech-python ${GITHUB_REF_NAME}" --notes-file notes.md)
          if [ "$PRERELEASE" = "true" ]; then args+=(--prerelease); fi
          gh release create "${GITHUB_REF_NAME}" "${args[@]}" dist/*
