# Categories of the generated release notes ("Changes" in each release), by PR
# label. Label every PR; RELEASING.md lists what each label means.
changelog:
  exclude:
    labels: [skip-changelog]
  categories:
    - title: Breaking changes
      labels: [breaking]
    - title: Features
      labels: [enhancement]
    - title: Fixes
      labels: [bug]
    - title: Vendored dependencies
      labels: [dependencies]
    - title: Packaging and CI
      labels: [ci]
    - title: Documentation
      labels: [documentation]
    - title: Other changes
      labels: ["*"]
