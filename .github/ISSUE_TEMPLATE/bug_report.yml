name: Bug report
description: Something does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Security vulnerabilities go through private reporting instead; see [SECURITY.md](https://github.com/PNL-toshiyaishihara/nemo-speech-python/blob/main/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead. Paste the full error message or traceback.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: A minimal script or the commands, and the model you used (catalog name or file name).
      render: python
    validations:
      required: true
  - type: textarea
    id: build-info
    attributes:
      label: Output of nemo_speech.build_info()
      description: |
        Run `python -c "import json, nemo_speech; print(json.dumps(nemo_speech.build_info(), indent=1))"`.
        It names the version, the variant (CPU, Vulkan, CUDA) and the vendored source commits.
        If `import nemo_speech` fails, give the name of the wheel file you installed instead.
      render: json
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Windows x64
        - Linux x86_64
        - Linux aarch64
        - macOS arm64
        - Other
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Python version and GPU
      description: For example "Python 3.12, NVIDIA RTX 4070, driver 580.82" or "Python 3.11, CPU only".
    validations:
      required: true
