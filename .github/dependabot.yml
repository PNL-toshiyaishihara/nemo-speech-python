# Dependabot: weekly version updates for the GitHub Actions the workflows use,
# monthly ones for the pinned build tools (.github/build-constraints.txt), and
# only security updates for the Python requirements, which are a library's
# lower bounds. Every PR is labelled `ci` for the release notes. The vendored
# submodules are updated by hand (RELEASING.md): Dependabot would follow their
# branch heads, not upstream release tags.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Let a new action release settle for a week before adopting it.
    cooldown:
      default-days: 7
    # Minor and patch updates share one PR; each major update gets its own.
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]
    labels: [ci]

  # The build tools CI installs from PyPI. Monthly, since some of the ~50
  # packages release every week and each update PR runs the CUDA builds;
  # security updates still come at once.
  - package-ecosystem: pip
    directory: /.github
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      build-tools:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # Also pinned in pyproject.toml's before-build; updated deliberately.
      - dependency-name: delvewheel
    labels: [ci]

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    # Zero disables version updates; security updates still open PRs.
    open-pull-requests-limit: 0
    labels: [ci]
